<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Vyoma — Real-Time Collaborative Coding Platform</title>
    <meta name="description" content="Vyoma is a premium real-time collaborative coding platform for seamless team development, rapid prototyping, and synchronous engineering with an integrated IDE, live chat, and talent discovery." />
    <meta name="author" content="Vyoma" />
    <meta name="theme-color" content="#1a1c24" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vyoma — Real-Time Collaborative Coding Platform" />
    <meta property="og:description" content="Code together in real-time with an integrated IDE, live cursors, chat, and a developer talent ecosystem." />
    <meta property="og:site_name" content="Vyoma" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vyoma — Real-Time Collaborative Coding" />
    <meta name="twitter:description" content="Code together in real-time with an integrated IDE, live cursors, chat, and a developer talent ecosystem." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo-mark-cyan.png" />
    <link rel="apple-touch-icon" href="/logo-mark-cyan.png" />
    <meta property="og:image" content="/logo.jpg" />
    <meta name="twitter:image" content="/logo.jpg" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1c24;color:#fff;font-family:Inter,sans-serif;text-align:center;padding:2rem;">
        <div>
          <h1 style="font-size:1.5rem;margin-bottom:1rem;">JavaScript Required</h1>
          <p style="color:#999;">Vyoma requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>

</html>
